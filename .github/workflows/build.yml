name: Licensed source rebuild

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Exact layout_MCU_deadtime_PWM target read from the actual ESC"
        required: true
        type: string

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: [self-hosted, Windows, X64, keil-c51]
    timeout-minutes: 20
    env:
      SROT_TARGET: ${{ inputs.target }}
      KEIL_C51_BIN: ${{ vars.KEIL_C51_BIN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify upstream source and compile serially
        shell: pwsh
        run: |
          python tools/verify_source.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/build.py --target "$env:SROT_TARGET"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-source-rebuild
          path: |
            build/hex/*.hex
            build/*-build.json
          if-no-files-found: error
