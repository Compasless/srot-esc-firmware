name: Verify ESC configurator
on:
  push:
    branches: [main]
    paths: ["configurator/**", ".github/workflows/configurator.yml"]
  pull_request:
    paths: ["configurator/**", ".github/workflows/configurator.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configurator:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: configurator
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: configurator/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Browser workflow with simulated SROT USB flasher
        run: npm run qa
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Compasless-SROT-ESC-Configurator
          path: |
            configurator/dist
            configurator/test-results
          if-no-files-found: error
          retention-days: 30
