name: Check upstream baseline

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Report upstream release without changing firmware
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          pinned = json.loads(pathlib.Path("upstream.lock.json").read_text())
          raw = subprocess.check_output(["gh", "api", "repos/bird-sanctuary/bluejay/releases/latest"])
          latest = json.loads(raw)
          status = "unchanged" if latest["tag_name"] == pinned["tag"] else "review required"
          text = (
              "# Upstream baseline\n\n"
              f"Pinned: {pinned['tag']} at {pinned['commit']}\n\n"
              f"Latest stable: {latest['tag_name']}\n\n"
              f"Status: {status}. No source or firmware was modified.\n"
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(text)
          print(text)
          PY
